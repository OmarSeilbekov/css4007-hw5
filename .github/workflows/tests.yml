name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
    fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    env:
      # No API key in CI: tests use the clearly labelled FAKE model only.
      LANGSMITH_TRACING: "false"
      HELPDESK_STORAGE_DIR: ci-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -v
      - name: Smoke-run all scenarios with the fake model
        run: python -m helpdesk.scenarios --model fake
